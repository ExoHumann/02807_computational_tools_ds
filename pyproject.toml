[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "afp"
version = "0.0.1"
description = "DTU 02807 project: neural audio fingerprinting with LSH retrieval and graph clustering"
authors = [
  { name = "Nikos Iliakis" },
]

keywords = ["audio fingerprinting", "locality-sensitive hashing", "graph clustering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "soundfile>=0.12",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "tqdm>=4.66",
    "transformers>=4.46",
]

[dependency-groups]
dev = [
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==1.19.1",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchaudio = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
